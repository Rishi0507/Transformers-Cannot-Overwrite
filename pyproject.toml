[project]
name = "tco"
version = "0.1.0"
description = "Typed forget gates for attention: experiments for Transformers Cannot Overwrite"
requires-python = ">=3.12"
dependencies = ["torch>=2.3", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
